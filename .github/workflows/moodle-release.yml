name: Release Plugin version to Moodle Marketplace

on:
  push:
    tags:
      - 'AY*'

jobs:
  # Our own guard. Upstream has no equivalent, so without this any AY* tag
  # pushed from any branch would publish to the public marketplace.
  guard:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 makes actions/checkout fetch every branch and tag, so
      # the --contains fallback below can see remote branches on a tag push.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag must be pushed from a MOODLE_*_STABLE branch
        # base_ref reaches the script as an env var, never interpolated into it:
        # branch names may contain quotes and $(), which would execute here.
        env:
          BASE: ${{ github.event.base_ref }}
        run: |
          TAGNAME="${GITHUB_REF#refs/tags/}"

          # Primary check: the branch ref the tag was actually pushed from.
          if [[ "$BASE" =~ ^refs/heads/MOODLE_[0-9]+_STABLE$ ]]; then
            echo "OK — pushed from ${BASE#refs/heads/}"
            echo "RELEASE_BRANCH=${BASE#refs/heads/}" >> "$GITHUB_ENV"
            exit 0
          fi

          # Fallback for pushes that carry no base_ref. Weaker: a commit shared
          # with a stable branch passes even if the tag was pushed elsewhere.
          BRANCHES=$(git branch -r --contains "refs/tags/${TAGNAME}" \
            | grep -E '^ *origin/MOODLE_[0-9]+_STABLE$' || true)
          if [[ -z "$BRANCHES" ]]; then
            echo "::error::Tag '$TAGNAME' is not on any MOODLE_*_STABLE branch"
            exit 1
          fi

          echo "OK — tag is on:${BRANCHES}"
          echo "RELEASE_BRANCH=$(echo $BRANCHES | sed 's#origin/##g')" >> "$GITHUB_ENV"

      # Moodle refuses to install a lower version over a higher one, so each
      # stable line must stay above every older line and below every newer one.
      # Issue 109: a 4.5 release outranked 5.1 and blocked upgrades to 5.1.
      - name: Version must sit between the older and newer stable lines
        run: |
          TAGNAME="${GITHUB_REF#refs/tags/}"
          if [[ "$RELEASE_BRANCH" == *" "* ]]; then
            echo "::error::Tag is on several stable branches ($RELEASE_BRANCH); tag a commit on one only"
            exit 1
          fi

          version_of() {
            git show "$1:version.php" | sed -n 's/^\$plugin->version *= *\([0-9]*\).*/\1/p'
          }

          OURS=$(version_of "refs/tags/${TAGNAME}")
          LINE=${RELEASE_BRANCH//[!0-9]/}
          if [[ -z "$OURS" || -z "$LINE" ]]; then
            echo "::error::Could not read the version of '$TAGNAME' on '$RELEASE_BRANCH'"
            exit 1
          fi

          FAILED=0
          for REF in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/MOODLE_*_STABLE'); do
            BRANCH=${REF#origin/}
            [[ "$BRANCH" =~ ^MOODLE_([0-9]+)_STABLE$ ]] || continue
            OTHER=${BASH_REMATCH[1]}
            THEIRS=$(version_of "$REF")
            [[ -n "$THEIRS" && "$OTHER" != "$LINE" ]] || continue

            if (( OTHER < LINE && THEIRS >= OURS )); then
              echo "::error::$BRANCH is at $THEIRS, which is not below $RELEASE_BRANCH ($OURS)"
              FAILED=1
            elif (( OTHER > LINE && THEIRS <= OURS )); then
              echo "::error::$BRANCH is at $THEIRS, which is not above $RELEASE_BRANCH ($OURS)"
              FAILED=1
            fi
          done

          if (( FAILED )); then
            exit 1
          fi
          echo "OK — $RELEASE_BRANCH at $OURS sits between the other stable lines"

  # Moodle HQ's official reusable workflow (revision 2026082501). Pinned to a
  # commit SHA on purpose: the repo has no version tags, and @main would let
  # upstream change our release process without notice. Update deliberately.
  #
  # No `tag` input is passed - upstream resolves it from GITHUB_REF, which is
  # the tag ref on a tag push. Do not add a workflow_dispatch trigger: upstream
  # archives HEAD without checking out the tag, so a dispatch from a branch
  # would publish the branch tip labelled with the tag.
  release-to-marketplace:
    needs: guard
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@3d279fa8fa0bba1f870281ad6816327c857131d8
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
