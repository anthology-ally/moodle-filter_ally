name: Release Plugin version to Moodle Marketplace

on:
  push:
    tags:
      - 'AY*'

jobs:
  # Our own guard. Upstream has no equivalent, so without this any AY* tag
  # pushed from any branch would publish to the public marketplace.
  guard:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      # fetch-depth: 0 makes actions/checkout fetch every branch and tag, so
      # the --contains fallback below can see remote branches on a tag push.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag must be pushed from a MOODLE_*_STABLE branch
        # base_ref reaches the script as an env var, never interpolated into it:
        # branch names may contain quotes and $(), which would execute here.
        env:
          BASE: ${{ github.event.base_ref }}
        run: |
          TAGNAME="${GITHUB_REF#refs/tags/}"

          # Primary check: the branch ref the tag was actually pushed from.
          if [[ "$BASE" =~ ^refs/heads/MOODLE_[0-9]+_STABLE$ ]]; then
            echo "OK — pushed from ${BASE#refs/heads/}"
            exit 0
          fi

          # Fallback for pushes that carry no base_ref. Weaker: a commit shared
          # with a stable branch passes even if the tag was pushed elsewhere.
          BRANCHES=$(git branch -r --contains "refs/tags/${TAGNAME}" \
            | grep -E '^ *origin/MOODLE_[0-9]+_STABLE$' || true)
          if [[ -z "$BRANCHES" ]]; then
            echo "::error::Tag '$TAGNAME' is not on any MOODLE_*_STABLE branch"
            exit 1
          fi

          echo "OK — tag is on:${BRANCHES}"

      # The Marketplace shows these notes on the version's page and its API
      # cannot change them later, so a missing or stale section stops the release.
      - name: CHANGES.md must start with this version's section
        id: notes
        run: |
          VERSION=$(sed -n 's/^\$plugin->version *= *\([0-9]*\).*/\1/p' version.php)
          HEADING=$(grep -m1 '^## ' CHANGES.md 2>/dev/null || true)
          if [[ -z "$VERSION" || "$HEADING" != *"($VERSION)"* ]]; then
            echo "::error::CHANGES.md must start with '## <release> ($VERSION)'; found '${HEADING:-nothing}'"
            exit 1
          fi
          # The first "## " section only: the release being tagged.
          NOTES=$(awk '/^## /{n++} n==1' CHANGES.md)
          DELIM="notes-$(openssl rand -hex 16)"
          { echo "notes<<$DELIM"; echo "$NOTES"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"

  # Moodle HQ's official reusable workflow (revision 2026101401). Pinned to a
  # commit SHA on purpose: the repo has no version tags, and @main would let
  # upstream change our release process without notice. Update deliberately.
  #
  # No `tag` input is passed - upstream resolves it from GITHUB_REF, which is
  # the tag ref on a tag push. Do not add a workflow_dispatch trigger: upstream
  # archives HEAD without checking out the tag, so a dispatch from a branch
  # would publish the branch tip labelled with the tag.
  release-to-marketplace:
    needs: guard
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@7c56bd9ce7b0a3125459924e7bd08570d41b9aa3
    with:
      release_notes: ${{ needs.guard.outputs.notes }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
